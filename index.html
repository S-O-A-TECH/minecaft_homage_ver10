<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', sans-serif;
        }

        canvas {
            display: block;
        }

        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 10;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }

        #crosshair::before {
            width: 2px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }

        #crosshair::after {
            height: 2px;
            width: 100%;
            top: 50%;
            transform: translateY(-50%);
        }

        /* === HUD === */
        #hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            pointer-events: none;
            z-index: 10;
            padding: 10px;
        }

        #hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        #stats-panel {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 200px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .stat-icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        .stat-bar-bg {
            width: 120px;
            height: 12px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 6px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.3s, background-color 0.3s;
        }

        #hp-bar {
            background-color: #2ecc71;
        }

        #ep-bar {
            background-color: #3498db;
        }

        #hunger-bar {
            background-color: #e67e22;
        }

        .stat-text {
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            min-width: 50px;
            text-align: right;
        }

        #time-panel {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 10px;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
        }

        #time-display {
            font-size: 20px;
            font-weight: bold;
        }

        #day-display {
            font-size: 12px;
            color: #aaa;
        }

        /* === HOTBAR === */
        #hotbar-container {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px;
            border-radius: 4px;
        }

        .hotbar-slot {
            width: 48px;
            height: 48px;
            border: 2px solid #555;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: #fff;
            text-align: center;
            cursor: pointer;
            user-select: none;
            background: rgba(0, 0, 0, 0.3);
        }

        .hotbar-slot.selected {
            border-color: #fff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        /* === INFO === */
        #info {
            position: fixed;
            top: 120px;
            left: 10px;
            color: #fff;
            font-family: monospace;
            font-size: 12px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 8px;
            border-radius: 4px;
            pointer-events: none;
        }

        /* === MODE INDICATOR === */
        #mode-indicator {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-family: sans-serif;
            font-size: 14px;
            z-index: 15;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 16px;
            border-radius: 4px;
            pointer-events: none;
            display: none;
        }

        /* === LOCK MESSAGE === */
        #lock-message {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 30;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #inventory-title {
            color: #fff;
            font-size: 20px;
            margin-bottom: 10px;
        }

        #inventory-grid {
            display: grid;
            grid-template-columns: repeat(9, 52px);
            grid-template-rows: repeat(4, 52px);
            gap: 2px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px;
            border-radius: 8px;
        }

        .inventory-slot {
            width: 52px;
            height: 52px;
            border: 2px solid #555;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: #fff;
            text-align: center;
            cursor: pointer;
            user-select: none;
            background: rgba(0, 0, 0, 0.3);
        }

        .inventory-slot:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* === CRAFTING OVERLAY === */
        #crafting-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 35;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #crafting-title {
            color: #fff;
            font-size: 20px;
            margin-bottom: 10px;
        }

        #crafting-container {
            display: flex;
            gap: 20px;
            max-width: 800px;
            max-height: 500px;
            width: 90%;
        }

        #recipe-list {
            flex: 1;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            padding: 8px;
            max-height: 500px;
        }

        #recipe-list::-webkit-scrollbar {
            width: 6px;
        }

        #recipe-list::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }

        .recipe-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 4px;
            cursor: pointer;
            color: #ccc;
            font-size: 13px;
            transition: background 0.15s;
        }

        .recipe-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .recipe-item.selected {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .recipe-item.craftable {
            color: #fff;
        }

        .recipe-icon {
            font-size: 16px;
            width: 24px;
            text-align: center;
        }

        .recipe-name {
            flex: 1;
        }

        .recipe-table-req {
            font-size: 14px;
            opacity: 0.7;
        }

        #recipe-detail {
            flex: 1.5;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
        }

        .recipe-detail-placeholder {
            color: #888;
            font-size: 14px;
            text-align: center;
        }

        .recipe-detail-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .recipe-detail-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .recipe-result-icon {
            font-size: 28px;
        }

        .recipe-result-name {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            flex: 1;
        }

        .recipe-can-craft {
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 4px;
        }

        .recipe-can-craft.craftable {
            background: rgba(46, 204, 113, 0.3);
            color: #2ecc71;
        }

        .recipe-can-craft.not-craftable {
            background: rgba(231, 76, 60, 0.3);
            color: #e74c3c;
        }

        .recipe-pattern-grid {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 3px;
            justify-content: center;
        }

        .recipe-pattern-slot {
            width: 60px;
            height: 60px;
            border: 2px solid #555;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: #fff;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
        }

        .recipe-pattern-slot.has-item {
            border-color: #2ecc71;
            background: rgba(46, 204, 113, 0.15);
        }

        .recipe-pattern-slot.missing-item {
            border-color: #e74c3c;
            background: rgba(231, 76, 60, 0.15);
        }

        .recipe-pattern-slot.empty {
            border-color: #333;
            background: rgba(0, 0, 0, 0.1);
        }

        .pattern-item-name {
            font-size: 9px;
            line-height: 1.1;
        }

        .pattern-item-count {
            font-size: 10px;
            font-weight: bold;
            margin-top: 2px;
        }

        .has-item .pattern-item-count {
            color: #2ecc71;
        }

        .missing-item .pattern-item-count {
            color: #e74c3c;
        }

        .recipe-missing {
            color: #e74c3c;
            font-size: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .missing-tag {
            background: rgba(231, 76, 60, 0.2);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
        }

        .craft-button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            background: #2ecc71;
            color: #fff;
            transition: background 0.2s;
        }

        .craft-button:hover {
            background: #27ae60;
        }

        .craft-button.disabled {
            background: #555;
            color: #999;
            cursor: not-allowed;
        }

        /* === DEATH OVERLAY === */
        #death-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(200, 0, 0, 0.6);
            z-index: 40;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #death-title {
            color: #fff;
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        #death-respawn {
            color: #fff;
            font-size: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 30px;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }

        #death-respawn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>
    <div id="crosshair"></div>

    <!-- HUD -->
    <div id="hud">
        <div id="hud-top">
            <div id="stats-panel">
                <div class="stat-row">
                    <span class="stat-icon">❤️</span>
                    <div class="stat-bar-bg">
                        <div class="stat-bar-fill" id="hp-bar"></div>
                    </div>
                    <span class="stat-text" id="hp-text">100/100</span>
                </div>
                <div class="stat-row">
                    <span class="stat-icon">⚡</span>
                    <div class="stat-bar-bg">
                        <div class="stat-bar-fill" id="ep-bar"></div>
                    </div>
                    <span class="stat-text" id="ep-text">100/100</span>
                </div>
                <div class="stat-row">
                    <span class="stat-icon">🍖</span>
                    <div class="stat-bar-bg">
                        <div class="stat-bar-fill" id="hunger-bar"></div>
                    </div>
                    <span class="stat-text" id="hunger-text">100/100</span>
                </div>
            </div>
            <div id="time-panel">
                <div id="time-display">06:00</div>
                <div id="day-display">Day 1</div>
            </div>
        </div>
    </div>

    <!-- Hotbar -->
    <div id="hotbar-container"></div>

    <!-- Info -->
    <div id="info">FPS: 0 | Pos: 0,0,0 | Chunks: 0</div>

    <!-- Lock message -->
    <div id="lock-message">Click to play</div>

    <!-- Mode indicator -->
    <div id="mode-indicator">🖱️ Cursor Mode</div>

    <!-- Inventory -->
    <div id="inventory-overlay">
        <div id="inventory-title">Inventory (Press E to close)</div>
        <div id="inventory-grid"></div>
    </div>

    <!-- Crafting -->
    <div id="crafting-overlay">
        <div id="crafting-title">🔨 Crafting</div>
        <div id="crafting-container">
            <div id="recipe-list"></div>
            <div id="recipe-detail">
                <div class="recipe-detail-placeholder">Select a recipe to view details</div>
            </div>
        </div>
    </div>

    <!-- Death -->
    <div id="death-overlay">
        <div id="death-title">You Died!</div>
        <div id="death-respawn">Click to Respawn</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
